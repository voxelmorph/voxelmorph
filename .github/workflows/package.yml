name: Package

on:
  pull_request:
    paths:
      - pyproject.toml
      - setup.py
      - voxelmorph/**
      - .github/workflows/package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade build check-wheel-contents twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Check wheel contents
        run: check-wheel-contents dist/*.whl
      - name: Rebuild wheel from source distribution
        run: python -m pip wheel --no-deps --wheel-dir rebuilt dist/*.tar.gz
      - name: Install built wheel without dependencies
        run: python -m pip install --no-deps dist/*.whl
      - name: Check installed metadata outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from importlib.metadata import distribution

          package = distribution("voxelmorph")
          assert package.version
          assert package.files
          assert any(str(path).endswith("voxelmorph/__init__.py") for path in package.files)
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
